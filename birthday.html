<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little surprise 🥥</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#ffb36b; --sky2:#ffe3a8; --sea:#1fa8b8; --sea2:#0f7d93;
    --sand:#f3d9a0; --palm:#2f8f4e; --palm2:#1f6e3a; --trunk:#8a5a2b;
    --ink:#3a2412; --cream:#fff6e0;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:var(--sky1);font-family:'Nunito',system-ui,sans-serif;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  /* ---------- start + mute ---------- */
  #start{display:none}
  #start.out{opacity:0;pointer-events:none}
  #go{background:none;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:'Lilita One',sans-serif;padding:20px}
  #go b{font-weight:400;font-size:min(30vw,150px);line-height:1;animation:bob 1.4s ease-in-out infinite alternate}
  #go span{font-size:clamp(1.4rem,6vw,2rem);text-shadow:0 3px 0 rgba(120,50,20,.35)}
  @keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
  #mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:50;width:42px;height:42px;border-radius:50%;
    border:2px solid #fff;background:rgba(0,0,0,.28);color:#fff;font-size:1.15rem;cursor:pointer}
  /* ---------- countdown ---------- */
  #count{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%,#ff9a5c,#d9476b 70%);color:#fff;transition:opacity .6s}
  #count.out{opacity:0;pointer-events:none}
  #num{font-family:'Lilita One',sans-serif;font-size:min(46vw,260px);line-height:1}
  #num.pop{animation:pop .9s ease-out}
  @keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.95}}
  #count p{position:absolute;bottom:14vh;font-weight:800;font-size:1.1rem;opacity:.9}
  /* ---------- scene ---------- */
  #scene{position:fixed;inset:0}
  #scene svg{width:100%;height:100%;display:block}
  .wave1{animation:drift 7s ease-in-out infinite alternate}
  .wave2{animation:drift 5s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
  .sway{transform-origin:230px 255px;animation:sway 5s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
  .cloud{animation:drift 14s ease-in-out infinite alternate}
  #coco{transform-origin:226px 268px;animation:swing 2.4s ease-in-out infinite alternate;cursor:pointer}
  @keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
  #coco.shake{animation:shake .45s ease-in-out}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
  #coco.fall{transform-origin:226px 306px;animation:fall 1s forwards;pointer-events:none}
  #coco.fall line{opacity:0}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0);animation-timing-function:ease-in}
    62%{transform:translateY(340px) rotate(150deg);animation-timing-function:ease-out}
    78%{transform:translateY(314px) rotate(175deg);animation-timing-function:ease-in}
    100%{transform:translateY(340px) rotate(200deg)}}
  #hit{fill:transparent}
  #shadow{transition:opacity .2s}
  .landed #shadow{opacity:.3}
  .crack #shadow{opacity:.45}
  #bL,#frL,#bR,#frR{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
  .crack #bL,.crack #frL{animation:hl .75s cubic-bezier(.2,.9,.3,1) forwards}
  .crack #bR,.crack #frR{animation:hr .75s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes hl{0%{opacity:1;transform:translate(0,-8px) rotate(0) scale(1)}100%{opacity:1;transform:translate(-38px,6px) rotate(-16deg) scale(1.75)}}
  @keyframes hr{0%{opacity:1;transform:translate(0,-8px) rotate(0) scale(1)}100%{opacity:1;transform:translate(38px,6px) rotate(16deg) scale(1.75)}}
  .dr{opacity:0}
  .crack .dr{animation:drop .9s ease-out forwards}
  @keyframes drop{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
  #friend{opacity:0}
  .emerge #friend{animation:up 1.4s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes up{0%{opacity:1;transform:translateY(235px)}70%{opacity:1;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
  #balloons,#bsw{transform-box:fill-box;transform-origin:50% 100%}
  #balloons{opacity:0}
  .pop #balloons{animation:rise 1.5s cubic-bezier(.2,1.2,.4,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(90px) scale(.2)}to{opacity:1;transform:none}}
  #bsw{animation:sway2 4s ease-in-out infinite alternate}
  @keyframes sway2{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  /* ---------- HUD ---------- */
  #hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:10;text-align:center;padding:0 58px;transition:opacity .4s}
  #hud h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);color:#fff;text-shadow:0 3px 0 rgba(120,50,20,.35)}
  #dots{display:flex;gap:10px;justify-content:center;margin-top:10px}
  #dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid #fff;transition:.25s}
  #dots i.on{background:#6b3d1a;border-color:#6b3d1a;transform:scale(1.2)}
  /* ---------- reveal ---------- */
  #reveal{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 20px);z-index:20;text-align:center;padding:0 58px;
    opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .6s,transform .8s cubic-bezier(.2,1.4,.4,1)}
  #reveal.show{opacity:1;transform:none}
  #reveal h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(2rem,9vw,3rem);line-height:1.05;color:#fff;
    text-shadow:0 3px 0 #d9476b,0 6px 16px rgba(0,0,0,.3)}
  .conf{position:fixed;top:-20px;width:10px;height:16px;z-index:25;pointer-events:none;animation:cf linear forwards}
  @keyframes cf{to{transform:translateY(112vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){.sway,.wave1,.wave2,.cloud,#coco{animation:none}}
</style>
</head>
<body>

<div id="start"><button id="go" aria-label="Open your surprise"><b>🎁</b><span>Tap to open your surprise</span></button></div>
<button id="mute" aria-label="Toggle sound">🔊</button>

<div id="count"><div id="num">3</div><p>Something is coming for you…</p></div>

<div id="hud">
  <h1>Tap the coconut 🥥</h1>
  <div id="dots"><i></i><i></i><i></i></div>
</div>

<div id="scene">

    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="420" x2="0" y2="590"><stop offset="0" stop-color="#37c3cc"/><stop offset="1" stop-color="#0f7d93"/></linearGradient>

<div id="reveal"><h2>Happy Birthday!</h2></div>

<script>

  /* ====== SOUND (all generated in code, no audio files needed) ====== */
  let AC=null, master=null, noiseBuf=null, muted=false;
  function initAudio(){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : .9; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      if(AC.state==='suspended') AC.resume();
    }catch(e){ AC=null; }
  }
  const T = ()=>AC.currentTime;
  function tone(f,t,dur,o={}){
    if(!AC) return; const {type='sine',vol=.3,to=null}=o;
    const osc=AC.createOscillator(), g=AC.createGain();
    osc.type=type; osc.frequency.setValueAtTime(f,t); if(to) osc.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t+dur+.05);
  }
  function noise(t,dur,o={}){
    if(!AC) return; const {vol=.3,type='bandpass',f=1000,to=null,q=1}=o;
    const src=AC.createBufferSource(); src.buffer=noiseBuf;
    const fl=AC.createBiquadFilter(); fl.type=type; fl.Q.value=q; fl.frequency.setValueAtTime(f,t); if(to) fl.frequency.exponentialRampToValueAtTime(to,t+dur);
    const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(fl); fl.connect(g); g.connect(master); src.start(t); src.stop(t+dur+.05);
  }
  const beep   = f => { if(AC) tone(f,T(),.25,{type:'triangle',vol:.35}); };
  const chime  = () => { if(!AC) return; const t=T(); [784,1047,1319].forEach((f,i)=>tone(f,t+i*.09,.5,{type:'triangle',vol:.2})); };
  const knock  = n => { if(!AC) return; const t=T(); tone(200+n*40,t,.14,{vol:.5,to:100}); noise(t,.05,{vol:.25,type:'lowpass',f:1800}); };
  const whoosh = () => { if(!AC) return; const t=T(); noise(t,.65,{vol:.35,f:1400,to:250,q:.8}); tone(520,t,.6,{type:'triangle',vol:.12,to:140}); };
  const thud   = v => { if(!AC) return; const t=T(); tone(140,t,.28,{vol:.7*v,to:45}); noise(t,.12,{vol:.3*v,type:'lowpass',f:500}); };
  const crackSfx = () => { if(!AC) return; const t=T();
    noise(t,.08,{vol:.7,type:'highpass',f:2500}); noise(t+.06,.06,{vol:.5,type:'highpass',f:3500});
    tone(90,t,.3,{vol:.6,to:40}); noise(t+.1,.5,{vol:.3,f:900,to:3000,q:.6}); };
  const emerge = () => { if(!AC) return; const t=T(); [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,t+i*.1,.45,{type:'triangle',vol:.22})); tone(200,t,.5,{vol:.3,to:600}); };
  const balloonSfx = () => { if(!AC) return; const t=T(); noise(t,.7,{vol:.12,f:500,to:2500,q:1.2}); [880,1175,1568].forEach((f,i)=>tone(f,t+.5+i*.07,.3,{vol:.12})); };
  function startWaves(){
    if(!AC) return;
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=700;
    const g=AC.createGain(); g.gain.value=.10;
    const lfo=AC.createOscillator(); lfo.frequency.value=.13; const lg=AC.createGain(); lg.gain.value=.07;
    lfo.connect(lg); lg.connect(g.gain); src.connect(fl); fl.connect(g); g.connect(master); src.start(); lfo.start();
  }
  function melody(){   // music-box "Happy Birthday" tune
    if(!AC) return;
    const B=.42, N={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
    const seq=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
               ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
               ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
               ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
    let t=T()+.1;
    seq.forEach(([n,d])=>{ const f=N[n]; tone(f,t,d*B*1.6,{vol:.28}); tone(f*2,t,d*B*.8,{type:'triangle',vol:.08}); t+=d*B; });
  }
  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', ()=>{
    muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
    if(master) master.gain.value = muted ? 0 : .9;
  });

  const num = document.getElementById('num'), count = document.getElementById('count');
  let n = 3;
  // tap-to-open (needed so the browser allows sound), then 3 → 2 → 1 and the beach appears
  function startCountdown(){
    n = 3;
    (function run(){
      num.textContent = n; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
      beep(n === 1 ? 880 : 660);
      if(n === 1){ setTimeout(()=>{ count.classList.add('out'); startWaves(); chime(); }, 1000); return; }
      n--; setTimeout(run, 1000);
    })();
  }
  let countdownStarted = false;
  function triggerCountdown(){
    if(countdownStarted) return;
    countdownStarted = true;
    initAudio();
    startCountdown();
  }

  const unlockAudio = () => {
    if(!AC) initAudio();
    if(AC && AC.state === 'suspended') AC.resume();
  };
  ['pointerdown', 'touchstart', 'click'].forEach(evt => {
    window.addEventListener(evt, unlockAudio, { passive: true });
  });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', triggerCountdown);
  } else {
    triggerCountdown();
  }

  const coco = document.getElementById('coco'), land = document.getElementById('land'),
        dots = document.querySelectorAll('#dots i'), hud = document.getElementById('hud');
  let taps = 0, done = false;

  coco.addEventListener('click', ()=>{
    if(done) return;
    taps++; knock(taps);
    dots.forEach((d,i)=>d.classList.toggle('on', i < taps));
    if(taps < 3){
      coco.classList.remove('shake'); void coco.getBoundingClientRect(); coco.classList.add('shake');
      return;
    }
    done = true; hud.style.opacity = 0;
    coco.classList.remove('shake'); coco.classList.add('fall');
    whoosh(); setTimeout(()=>thud(1),620); setTimeout(()=>thud(.5),1000);
    const sc = document.getElementById('scene');
    setTimeout(()=>sc.classList.add('landed'), 1000);
    setTimeout(()=>{ coco.style.visibility = 'hidden'; sc.classList.add('crack'); crackSfx(); }, 1900);
    setTimeout(showReveal, 2400);
  });


  // balloons tied above his head
  (function(){
    const cols=['#ff5d73','#ffd23f','#3ec1d3','#c77dff','#ff9a5c'];
    const pos=[[55,78],[105,48],[150,30],[196,50],[246,80]];
    let g='';
    pos.forEach(([x,y],i)=>{
      g+=`<path d="M${x} ${y+34} Q${(x+150)/2+(i-2)*6} ${(y+190)/2} 150 190" stroke="#fff" stroke-width="1.6" fill="none"/>`+
         `<ellipse cx="${x}" cy="${y}" rx="26" ry="33" fill="${cols[i]}"/>`+
         `<path d="M${x-5} ${y+33}l5 7 5-7Z" fill="${cols[i]}"/>`+
         `<ellipse cx="${x-9}" cy="${y-12}" rx="5" ry="9" fill="#fff" opacity=".4"/>`;
    });
    document.getElementById('bin').innerHTML=g;
  })();

  function showReveal(){
    const sc = document.getElementById('scene');
    sc.classList.add('emerge'); emerge();                       // he rises out of the cracked coconut
    setTimeout(()=>document.getElementById('reveal').classList.add('show'), 900);
    setTimeout(()=>{ sc.classList.add('pop'); balloonSfx(); }, 1100);   // balloons float up
    setTimeout(()=>{ confetti(); melody(); }, 1500);
  }

  function confetti(){
    const cols = ['#ff5d73','#ffd23f','#3ec1d3','#7bd389','#fff','#ff9a5c'];
    for(let i=0;i<90;i++){
      const c = document.createElement('div'); c.className='conf';
      c.style.left = Math.random()*100+'vw';
      c.style.background = cols[i % cols.length];
      c.style.animationDuration = (2.5+Math.random()*3)+'s';
      c.style.animationDelay = (Math.random()*1.2)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 7000);
    }
  }
</script>
